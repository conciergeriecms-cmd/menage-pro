<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ménage Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
.hidden{display:none!important}
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px}
.login-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 25px 50px rgba(0,0,0,0.35)}
.login-box input{width:100%;padding:15px;border:2px solid #e2e8f0;border-radius:12px;font-size:1.3rem;text-align:center;letter-spacing:6px;font-weight:700;margin-bottom:15px;outline:none}
.login-box input:focus{border-color:#667eea}
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:600;cursor:pointer}
.error-msg{color:#e53e3e;text-align:center;margin-top:10px;font-size:.9rem}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.btn-logout{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.82rem}
.prog-wrap{background:#fff;padding:14px 18px;border-bottom:1px solid #e2e8f0}
.prog-top{display:flex;justify-content:space-between;font-size:.82rem;color:#718096;margin-bottom:6px}
.prog-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:4px;transition:.4s}
.card{margin:12px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
.card-head{padding:14px 18px;background:#f8fafc;border-bottom:1px solid #edf2f7;display:flex;align-items:center;gap:10px}
.card-head h3{font-size:.95rem;font-weight:600;color:#2d3748;flex:1}
.badge{background:#667eea;color:#fff;border-radius:20px;padding:2px 10px;font-size:.72rem}
.badge.opt{background:#68d391}
.ti{padding:14px 18px;border-bottom:1px solid #f7fafc}
.ti:last-child{border-bottom:none}
.ti-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ti-ico{font-size:1.4rem}
.ti-name{font-weight:600;color:#2d3748;flex:1;font-size:.95rem}
.ti-check{width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
.ti-check.ok{background:#48bb78;border-color:#48bb78;color:#fff}
.photo-box{background:#f7fafc;border:2px dashed #cbd5e0;border-radius:10px;padding:14px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.photo-box:hover{border-color:#667eea;background:#ebf4ff}
.photo-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-box .ph-hint{color:#a0aec0;font-size:.82rem;pointer-events:none}
.photo-box .ph-hint .ico{font-size:1.4rem;display:block;margin-bottom:3px}
.photo-box img{width:100%;max-height:160px;object-fit:cover;border-radius:8px;display:block}
.photo-box.ok{border:2px solid #48bb78;background:#f0fff4}
.note{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-top:8px;font-size:.82rem;resize:none;height:50px;outline:none;font-family:inherit}
.note:focus{border-color:#667eea}
.sub-wrap{margin:12px;padding-bottom:24px}
.btn-sub{width:100%;padding:16px;background:linear-gradient(135deg,#48bb78,#38a169);color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(72,187,120,.4)}
.btn-sub:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#successScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#f0fff4,#c6f6d5);text-align:center;padding:30px}
#supervisorScreen{min-height:100vh;background:#1a1a2e}
.sup-hd{background:#2d3748;padding:18px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center}
.stat .n{font-size:1.8rem;font-weight:700;color:#667eea}
.stat .l{font-size:.75rem;color:#718096;margin-top:3px}
.s-card{background:#fff;border-radius:12px;margin:10px 14px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.s-card h4{color:#2d3748;font-size:.9rem;margin-bottom:6px}
.s-t{font-size:.75rem;color:#a0aec0;margin-left:4px}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{padding:3px 8px;border-radius:20px;font-size:.7rem;font-weight:500;background:#c6f6d5;color:#276749}
.sec-tit{color:#718096;font-size:.75rem;font-weight:600;padding:8px 14px 4px;text-transform:uppercase;letter-spacing:.05em}
.imp-card{background:#fff;border-radius:12px;margin:10px 14px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);border-left:4px solid #f6ad55}
.imp-card h4{color:#744210;font-size:.88rem;margin-bottom:4px}
.imp-card p{color:#718096;font-size:.82rem}
.imp-card img{width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:7px}
.nav-t{display:flex;background:#2d3748;padding:4px;gap:3px}
.nt{flex:1;padding:9px;text-align:center;color:#a0aec0;cursor:pointer;border-radius:7px;font-size:.78rem;font-weight:500}
.nt.on{background:#667eea;color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2d3748;color:#fff;padding:10px 22px;border-radius:10px;font-size:.88rem;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}
#supLoginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#2d3748);padding:20px}
#supLoginScreen .login-box{background:#2d3748;border:1px solid #4a5568}
#supLoginScreen .login-box input{background:#1a202c;border-color:#4a5568;color:#fff}
.lbadge{background:#4a5568;color:#e2e8f0;padding:3px 8px;border-radius:6px;font-size:.7rem;font-family:monospace;letter-spacing:1px}
</style>
</head>
<body>
<div id="loginScreen">
  <div style="font-size:3.5rem;margin-bottom:10px">🏠</div>
  <h1 style="color:#fff;font-size:1.7rem;margin-bottom:6px">Ménage Pro</h1>
  <p style="color:#a0aec0;font-size:.9rem;margin-bottom:28px">Entrez votre code logement</p>
  <div class="login-box">
    <input type="text" id="codeInput" placeholder="CODE" maxlength="10" autocomplete="off" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-primary" onclick="loginAgent()">Connexion →</button>
    <div class="error-msg hidden" id="loginError">❌ Code invalide</div>
    <div style="margin-top:18px;text-align:center"><a href="#" onclick="showSupLogin(event)" style="color:#718096;font-size:.78rem;text-decoration:none">🔐 Accès superviseur</a></div>
  </div>
</div>
<div id="supLoginScreen" class="hidden">
  <div style="font-size:3rem;margin-bottom:10px">👁️</div>
  <div class="login-box">
    <h1 style="color:#fff;text-align:center;font-size:1.4rem;margin-bottom:6px">Superviseur</h1>
    <p style="color:#a0aec0;text-align:center;font-size:.85rem;margin-bottom:20px">Tableau de bord temps réel</p>
    <input type="password" id="supPwd" placeholder="Mot de passe" style="letter-spacing:3px">
    <button class="btn-primary" onclick="loginSup()">Accéder</button>
    <div class="error-msg hidden" id="supErr">❌ Mot de passe incorrect</div>
    <div style="margin-top:14px;text-align:center"><a href="#" onclick="showLogin(event)" style="color:#718096;font-size:.78rem;text-decoration:none">← Retour</a></div>
  </div>
</div>
<div id="appScreen" class="hidden">
  <header>
    <div>
      <div id="hdrName" style="font-weight:700;font-size:1rem"></div>
      <div style="font-size:.73rem;opacity:.75">Checklist ménage</div>
    </div>
    <button class="btn-logout" onclick="logout()">Déco</button>
  </header>
  <div class="prog-wrap">
    <div class="prog-top"><span>Progression</span><span id="progTxt">0/8</span></div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div id="tasksCont"></div>
  <div class="sub-wrap">
    <button class="btn-sub" id="subBtn" onclick="submitAll()" disabled>✅ Valider le ménage complet</button>
  </div>
</div>
<div id="successScreen" class="hidden">
  <div style="font-size:5rem;margin-bottom:18px">✅</div>
  <h2 style="color:#276749;font-size:1.7rem;margin-bottom:8px">Ménage validé !</h2>
  <p style="color:#2f855a">Toutes les tâches enregistrées.</p>
  <button class="btn-primary" onclick="logout()" style="margin-top:28px;max-width:280px">Nouveau ménage</button>
</div>
<div id="supervisorScreen" class="hidden">
  <div class="sup-hd">
    <div><h2 style="font-size:1.1rem">👁️ Superviseur</h2><div style="font-size:.72rem;opacity:.6;margin-top:2px" id="lastUpd"></div></div>
    <div style="display:flex;gap:7px">
      <button style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:.8rem" onclick="loadDash()">🔄</button>
      <button class="btn-logout" onclick="logout()">Déco</button>
    </div>
  </div>
  <div class="nav-t">
    <div class="nt on" id="nt-v" onclick="swTab('v')">📋 Validations</div>
    <div class="nt" id="nt-i" onclick="swTab('i')">⚠️ Imprévus</div>
    <div class="nt" id="nt-l" onclick="swTab('l')">🏠 Logements</div>
  </div>
  <div id="dashCont"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const SB_URL='https://osxrvelkhqaxdkmokuvi.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zeHJ2ZWxraHFheGRrbW9rdXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTY5NDQsImV4cCI6MjA5MTkzMjk0NH0.T0DVMCdVwRxK4vcEBanv-AwJ0p5wgboUAseLYCsM2h8L';
const sb=supabase.createClient(SB_URL,SB_KEY);
const TASKS=[{id:1,n:'Cuisine',e:'🍳',r:true},{id:2,n:'Salon',e:'🛋️',r:true},{id:3,n:'Chambre',e:'🛏️',r:true},{id:4,n:'Salle de bain',e:'🚿',r:true},{id:5,n:'WC',e:'🚽',r:true},{id:6,n:'Couloir',e:'🚪',r:true},{id:7,n:'Linge',e:'👕',r:true},{id:8,n:'Poubelles',e:'🗑️',r:true},{id:9,n:'Terrasse',e:'🌿',r:false},{id:10,n:'Jardin',e:'🌳',r:false}];
let logement=null,td={},stab='v',siv=null;
function toast(m,d=2500){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),d);}
function hide(){['loginScreen','supLoginScreen','appScreen','successScreen','supervisorScreen'].forEach(id=>document.getElementById(id).classList.add('hidden'));}
function showLogin(e){if(e)e.preventDefault();hide();document.getElementById('loginScreen').classList.remove('hidden');}
function showSupLogin(e){if(e)e.preventDefault();hide();document.getElementById('supLoginScreen').classList.remove('hidden');}
async function loginAgent(){
  const code=document.getElementById('codeInput').value.trim().toUpperCase();
  if(!code)return;toast('🔍 Vérification...');
  const {data,error}=await sb.from('logements').select('*').eq('code',code).single();
  if(error||!data){document.getElementById('loginError').classList.remove('hidden');return;}
  document.getElementById('loginError').classList.add('hidden');
  logement=data;td={};
  TASKS.forEach(t=>{td[t.id]={f:null,d:false,note:''};});
  document.getElementById('hdrName').textContent=logement.nom||logement.code;
  renderTasks();hide();document.getElementById('appScreen').classList.remove('hidden');updateProg();window.scrollTo(0,0);
}
function renderTasks(){
  const c=document.getElementById('tasksCont');c.innerHTML='';
  const r=document.createElement('div');r.className='card';
  r.innerHTML='<div class="card-head"><span style="font-size:1.3rem">📋</span><h3>Tâches obligatoires</h3><span class="badge">8 requises</span></div>';
  TASKS.filter(t=>t.r).forEach(t=>r.appendChild(mkTask(t)));c.appendChild(r);
  const o=document.createElement('div');o.className='card';
  o.innerHTML='<div class="card-head"><span style="font-size:1.3rem">🌟</span><h3>Espaces extérieurs</h3><span class="badge opt">Optionnel</span></div>';
  TASKS.filter(t=>!t.r).forEach(t=>o.appendChild(mkTask(t)));c.appendChild(o);
  const imp=document.createElement('div');imp.className='card';
  imp.innerHTML='<div class="card-head"><span style="font-size:1.3rem">⚠️</span><h3>Signaler un imprèvu</h3><span class="badge opt">Optionnel</span></div><div class="ti"><textarea id="impDesc" placeholder="Décrivez le problème..." class="note" style="height:70px;width:100%;margin-top:0"></textarea><div class="photo-box" id="impPh" style="margin-top:10px"><input type="file" accept="image/*" capture="environment" onchange="handleImpPh(event)"><div class="ph-hint"><span class="ico">📷</span>Photo de l'imprèvu</div></div></div>';
  c.appendChild(imp);
}
function mkTask(task){
  const d=document.createElement('div');d.className='ti';d.id='ti-'+task.id;
  d.innerHTML='<div class="ti-top"><span class="ti-ico">'+task.e+'</span><span class="ti-name">'+task.n+(task.r?'':' <span style="color:#a0aec0;font-size:.75rem;font-weight:400">(opt.)</span>')+'</span><div class="ti-check" id="chk-'+task.id+'"></div></div><div class="photo-box" id="pb-'+task.id+'"><input type="file" accept="image/*" capture="environment" onchange="handlePh(event,'+task.id+')"><div class="ph-hint"><span class="ico">📷</span>'+(task.r?'Photo requise':'Photo optionnelle')+'</div></div><textarea class="note" placeholder="Note..." onchange="td['+task.id+'].note=this.value"></textarea>';
  return d;
}
function handlePh(ev,id){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    td[id].f=f;td[id].d=true;
    const pb=document.getElementById('pb-'+id);
    pb.classList.add('ok');
    pb.innerHTML='<img src="'+e.target.result+'"><input type="file" accept="image/*" capture="environment" onchange="handlePh(event,'+id+')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">';
    const chk=document.getElementById('chk-'+id);chk.classList.add('ok');chk.textContent='✓';
    updateProg();toast('✅ '+TASKS.find(t=>t.id===id).n+' validé !');
  };
  r.readAsDataURL(f);
}
function handleImpPh(ev){
  const f=ev.target.files[0];if(!f)return;window._impF=f;
  const r=new FileReader();
  r.onload=e=>{
    const pb=document.getElementById('impPh');pb.classList.add('ok');
    pb.innerHTML='<img src="'+e.target.result+'"><input type="file" accept="image/*" capture="environment" onchange="handleImpPh(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">';
  };r.readAsDataURL(f);
}
function updateProg(){
  const req=TASKS.filter(t=>t.r),done=req.filter(t=>td[t.id]&&td[t.id].d).length;
  const pct=(done/req.length)*100;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progTxt').textContent=done+'/'+req.length;
  document.getElementById('subBtn').disabled=done<req.length;
}
async function upPhoto(f,name){
  try{
    const ext=f.name.split('.').pop()||'jpg';
    const path=logement.code+'/'+Date.now()+'_'+name.replace(/s+/g,'_')+'.'+ext;
    const {error}=await sb.storage.from('menage-photos').upload(path,f,{contentType:f.type,upsert:true});
    if(error){console.warn(error.message);return null;}
    return sb.storage.from('menage-photos').getPublicUrl(path).data.publicUrl;
  }catch(e){return null;}
}
async function submitAll(){
  const btn=document.getElementById('subBtn');btn.disabled=true;btn.textContent='⏳ Enregistrement...';
  try{
    const h=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    for(const task of TASKS){
      if(!td[task.id].d)continue;
      let url=null;
      if(td[task.id].f){toast('📤 '+task.n+'...');url=await upPhoto(td[task.id].f,task.n);}
      await sb.from('validations').insert({logement_code:logement.code,tache_id:task.id,tache_nom:task.n,photo_url:url,heure:h});
    }
    const desc=(document.getElementById('impDesc').value||'').trim();
    if(desc||window._impF){
      let url=null;if(window._impF)url=await upPhoto(window._impF,'imprev');
      await sb.from('imprévus').insert({logement_code:logement.code,description:desc||'Imprèvu signalé',photo_url:url,heure:h});
    }
    hide();document.getElementById('successScreen').classList.remove('hidden');window._impF=null;
  }catch(e){toast('❌ '+e.message);btn.disabled=false;btn.textContent='✅ Valider le ménage complet';}
}
function loginSup(){
  if(document.getElementById('supPwd').value!=='Didine2024!'){document.getElementById('supErr').classList.remove('hidden');return;}
  document.getElementById('supErr').classList.add('hidden');
  hide();document.getElementById('supervisorScreen').classList.remove('hidden');
  loadDash();if(siv)clearInterval(siv);siv=setInterval(loadDash,30000);
}
function swTab(t){
  stab=t;['v','i','l'].forEach(x=>document.getElementById('nt-'+x).classList.toggle('on',x===t));loadDash();
}
async function loadDash(){
  document.getElementById('lastUpd').textContent='Mis à jour '+new Date().toLocaleTimeString('fr-FR');
  const c=document.getElementById('dashCont');
  c.innerHTML='<div style="color:#718096;text-align:center;padding:30px;font-size:.85rem">⏳ Chargement...</div>';
  if(stab==='v'){
    const {data}=await sb.from('validations').select('*').order('created_at',{ascending:false}).limit(300);
    if(!data||!data.length){c.innerHTML='<div style="color:#718096;text-align:center;padding:40px">Aucune validation</div>';return;}
    const grp={};
    data.forEach(v=>{const dt=new Date(v.created_at).toLocaleDateString('fr-FR'),k=v.logement_code+'__'+dt+'__'+(v.heure||'');if(!grp[k])grp[k]={code:v.logement_code,dt,h:v.heure,tasks:[]};grp[k].tasks.push(v);});
    const tot=Object.keys(grp).length,pics=data.filter(v=>v.photo_url).length,lgs=new Set(data.map(v=>v.logement_code)).size;
    let html='<div class="stats"><div class="stat"><div class="n">'+tot+'</div><div class="l">Sessions</div></div><div class="stat"><div class="n">'+pics+'</div><div class="l">Photos</div></div><div class="stat"><div class="n">'+lgs+'</div><div class="l">Logements</div></div><div class="stat"><div class="n">'+data.length+'</div><div class="l">Tâches</div></div></div><div class="sec-tit">Dernières sessions</div>';
    Object.values(grp).slice(0,25).forEach(g=>{
      const pills=g.tasks.map(t=>'<span class="pill">'+t.tache_nom+'</span>').join(''),ph=g.tasks.filter(t=>t.photo_url).length;
      html+='<div class="s-card"><h4>🏠 <span class="lbadge">'+g.code+'</span><span class="s-t">'+g.dt+(g.h?' à '+g.h:'')+'</span></h4><div style="font-size:.75rem;color:#718096;margin-bottom:5px">📷 '+ph+' photo(s)</div><div class="pills">'+pills+'</div></div>';
    });
    c.innerHTML=html;
  }else if(stab==='i'){
    const {data}=await sb.from('imprévus').select('*').order('created_at',{ascending:false}).limit(50);
    if(!data||!data.length){c.innerHTML='<div style="color:#718096;text-align:center;padding:40px">✅ Aucun imprèvu</div>';return;}
    let html='';
    data.forEach(imp=>{const dt=new Date(imp.created_at).toLocaleDateString('fr-FR');html+='<div class="imp-card"><h4>⚠️ <span class="lbadge">'+imp.logement_code+'</span><span class="s-t">'+dt+(imp.heure?' à '+imp.heure:'')+'</span></h4><p style="margin-top:5px">'+imp.description+'</p>'+(imp.photo_url?'<img src="'+imp.photo_url+'" alt="">':'')+'</div>';});
    c.innerHTML=html;
  }else{
    const {data}=await sb.from('logements').select('*').order('created_at',{ascending:false});
    if(!data||!data.length){c.innerHTML='<div style="color:#718096;text-align:center;padding:40px">Aucun logement</div>';return;}
    let html='<div style="padding:4px 0">';
    data.forEach(l=>{const dt=l.created_at?new Date(l.created_at).toLocaleDateString('fr-FR'):'';html+='<div class="s-card" style="margin:10px 14px"><div style="font-weight:600;color:#2d3748;margin-bottom:8px">🏠 '+(l.nom||'Sans nom')+'</div><div style="display:flex;align-items:center;gap:8px"><span class="lbadge" style="font-size:.82rem;padding:5px 12px;background:#667eea;color:#fff;border-radius:8px">'+l.code+'</span><span style="color:#718096;font-size:.75rem">'+dt+'</span></div></div>';});
    html+='</div>';c.innerHTML=html;
  }
}
function logout(){
  logement=null;td={};window._impF=null;
  if(siv){clearInterval(siv);siv=null;}
  document.getElementById('codeInput').value='';document.getElementById('supPwd').value='';showLogin(null);
}
document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')loginAgent();});
document.getElementById('supPwd').addEventListener('keydown',e=>{if(e.key==='Enter')loginSup();});
</script>
</body>
